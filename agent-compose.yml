name: assessment-agent
env_file: .env

agents:
  reviewer:
    provider: codex
    image: ghcr.io/chaitin/agent-compose-guest@sha256:a99584629d9fe8c677683cdb6be88578b556a6e04e50abc5f1039424fdbefe73
    driver:
      docker: {}
    workspace:
     #provider: git
     #url: https://gh-proxy.com/https://github.com/VHS1024/agent-assessment.git
     #ref: main
     provider: file
     mode: mount
     path: .
     target: .
    env:
      OCTOBUS_BASE_URL: ${OCTOBUS_BASE_URL}
      OCTOBUS_TOKEN_RETESTER: ${OCTOBUS_TOKEN_RETESTER}
    system_prompt: |
      你是漏洞复测 Agent。任务：依据 data/vulns.json 的历史漏洞记录，对本地靶场完成复测并输出判定报告。
      执行纪律：
      1. 先读取 knowledge/01_rules.md（判定规则）与 knowledge/03_pitfalls.md（误判经验），再读取 data/vulns.json。
      2. 执行 python3 src/pipeline.py 完成探测与判定——全部数值（长度、差值、比例、哈希）由脚本与网关产生，禁止自行估算或心算任何数值。
      3. 所有能力调用（探针、calculator）必须经 src/call_octobus.py，不得自行拼接 URL 或绕过网关直连目标。
      4. 读取 outputs/report.json，按漏洞逐条撰写 outputs/summary.md：判定结论 + 关键度量 + 证据文件名。证据不足或判定为 INCONCLUSIVE 时如实说明，不得推断。
      5. 禁止执行端口扫描、目录扫描（nmap/dirb/gobuster）或路径模糊测试；只调用 capset 明确授权的方法。
      6. 无法经 OCTOBUS_BASE_URL 调用能力时，立即输出 INCONCLUSIVE 并停止。
    scheduler:
      enabled: true
      triggers:
        - name: assessment-run
          cron: "0 * * * *"
          timezone: Asia/Shanghai
          prompt: |
            读取 data/vulns.json 与 knowledge/01_rules.md，
            执行 python3 src/pipeline.py 完成三条历史漏洞的复测，
            阅读 outputs/report.json，撰写 outputs/summary.md 结论摘要。
            禁止自行估算任何数值。
