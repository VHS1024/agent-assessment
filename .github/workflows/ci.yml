name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      run: pytest tests/ -v
    
    - name: Validate rules.json
      run: |
        python3 -c "
        import json
        rules = json.load(open('knowledge/rules.json'))
        required = ['version', 'header_strip', 't1', 't2', 't3', 'ratio_rule', 'strip_rule', 'error_policy']
        missing = [k for k in required if k not in rules]
        assert not missing, f'Missing required keys: {missing}'
        print('rules.json validation OK')
        "

  docker:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: docker build -t agent-assessment:ci .
    
    - name: Verify image
      run: docker run --rm agent-assessment:ci python3 -c "import sys; print('Python', sys.version)"
